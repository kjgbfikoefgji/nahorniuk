<header class="site-header" id="top">
  <div class="container header-row">
    <a class="logo" href="#top" aria-label="Нагорнюк, онлайн-тренер. На початок сторінки">
      <span class="logo-mark" aria-hidden="true">Н</span>
      <span class="logo-text">Нагорнюк <b>тренер</b></span>
    </a>
    <nav class="nav" id="nav" aria-label="Головне меню">
