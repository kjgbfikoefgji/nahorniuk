<dialog class="lightbox" id="lightbox" aria-label="Перегляд результату">
  <button class="icon-btn lb-close" type="button" aria-label="Закрити" data-lb-close><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
  <button class="icon-btn lb-nav lb-prev" type="button" aria-label="Попереднє фото" data-lb-prev><svg class="ico" aria-hidden="true"><use href="#i-left"/></svg></button>
  <figure class="lb-figure">
    <img id="lb-img" alt="" width="1200" height="1200">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="icon-btn lb-nav lb-next" type="button" aria-label="Наступне фото" data-lb-next><svg class="ico" aria-hidden="true"><use href="#i-right"/></svg></button>
</dialog>
