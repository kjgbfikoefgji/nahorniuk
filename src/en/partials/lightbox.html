<dialog class="lightbox" id="lightbox" aria-label="Result viewer">
  <button class="icon-btn lb-close" type="button" aria-label="Close" data-lb-close><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
  <button class="icon-btn lb-nav lb-prev" type="button" aria-label="Previous photo" data-lb-prev><svg class="ico" aria-hidden="true"><use href="#i-left"/></svg></button>
  <figure class="lb-figure">
    <img id="lb-img" alt="" width="1200" height="1200">
    <figcaption><span class="lb-count" id="lb-count"></span><span id="lb-cap"></span></figcaption>
  </figure>
  <button class="icon-btn lb-nav lb-next" type="button" aria-label="Next photo" data-lb-next><svg class="ico" aria-hidden="true"><use href="#i-right"/></svg></button>
</dialog>
