# Публікується лише site/ (збирається python main.py build з src/). Службові
# файли репозиторію (src/, tools/, main.py, README...) туди не потрапляють.
# Хеші inline-скриптів у політиці CSP перераховує python main.py build.
[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-TvUnJIIRZToMKXiO5pkJDrsV4njLESYxqgfiU5nisZ8=' 'sha256-gVAwSHcTsShhrnahn0zEPNFsAZX4LvBGcJqDMOugexQ='; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors https://andriy-sokhanych.netlify.app"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/out/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Шрифти без хешів у назві: 30 діб без immutable, щоб заміна файлу доїхала.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/img/og-4.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
