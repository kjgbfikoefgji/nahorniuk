# Публікується лише site/ (збирається python main.py build з src/). Службові
# файли репозиторію (src/, tools/, main.py, README...) туди не потрапляють.
# Хеші inline-скриптів у політиці CSP перераховує python main.py build.
[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-JFz6WnWBcwOapFmZqT7rZ1sHTb5ZSa/OcgKzoU7xN10=' 'sha256-6tJP7edH4G/GXLICAGL/q/nXaAeYFrLHsoSvXJICZjw=' 'sha256-98YC62a+aSmrWSJXdtBtVGPFgC/wKWx/7xMC4iKKcis='; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/out/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Шрифти без хешів у назві: 30 діб без immutable, щоб заміна файлу доїхала.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/img/og.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
